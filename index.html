<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="하프타임 FC 가상 클럽하우스 - 유소년 축구 클럽 3D 웹 게임">
</head>
<body>
<title>하프타임 FC 클럽하우스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;700;800&family=Jua&display=swap">
<style>
/* Layout: full-screen voxel club ground; chunky "kit-bag" HUD chips pinned to the corners; modals are paper notice sheets with a navy header band */
:root{
  --navy:#1b2a4a; --navy-2:#2b4170; --sun:#ffc93c; --sun-2:#e9a900; --chalk:#fffaf0; --paper:#fff6e0;
  --grass:#4f9e3a; --coral:#ff6a48; --muted:#5d6884; --sky:#9fd8f5; --line:rgba(27,42,74,.14);
  --display:'Jua','Gothic A1','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --body:'Gothic A1','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--sky);color:var(--navy);font-family:var(--body);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;font:800 12px/1 var(--body);color:var(--chalk);background:rgba(27,42,74,.78);padding:4px 7px;border-radius:6px;white-space:nowrap;will-change:transform}
.tag.me{background:var(--sun);color:var(--navy)}
.tag.coach{background:var(--coral);color:#fff}
.tag.friend{background:#2f8a43;color:#fff}
#onChip{background:#2f8a43;color:#fff;border-color:#1d5a2a}
#saveChip{font-size:11px;padding:5px 8px}
.err{background:#ffe3dc;color:#9c2a12;border:2px solid #e8443a;border-radius:10px;padding:8px 10px;font:700 13px/1.45 var(--body)}
#sPin{letter-spacing:.4em}
.bubble{position:absolute;left:0;top:0;font:700 14px/1.2 var(--body);color:var(--navy);background:#fff;border:3px solid var(--navy);padding:6px 10px;border-radius:12px;white-space:nowrap;will-change:transform}
.bubble::after{content:"";position:absolute;left:50%;bottom:-9px;margin-left:-6px;border:6px solid transparent;border-top-color:var(--navy);border-bottom:0}

button{font-family:var(--display);color:inherit}
.btn{font-family:var(--display);font-size:16px;line-height:1;background:var(--sun);color:var(--navy);border:3px solid var(--navy);border-radius:10px;padding:9px 14px;box-shadow:0 4px 0 var(--navy);cursor:pointer;transition:transform .06s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--navy)}
.btn.ghost{background:var(--chalk)}
.btn.navy{background:var(--navy);color:var(--chalk);border-color:var(--navy);box-shadow:0 4px 0 #0d1528}
.btn.coral{background:var(--coral);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.sw:focus-visible,input:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
kbd{display:inline-block;font:800 12px/1 var(--body);background:var(--navy);color:var(--chalk);border-radius:5px;padding:4px 6px;margin-right:6px;vertical-align:2px}

/* HUD */
.hud{position:fixed;z-index:5;display:flex;gap:8px}
#hud-tl{top:calc(12px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));flex-direction:column;align-items:flex-start}
#hud-tr{top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));flex-direction:column;align-items:flex-end}
.card{display:flex;align-items:center;gap:10px;background:var(--navy);color:var(--chalk);border-radius:12px;padding:7px 12px 7px 7px;box-shadow:0 4px 0 rgba(13,21,40,.5)}
.card .num{display:grid;place-items:center;width:38px;height:38px;border-radius:8px;background:var(--sun);color:var(--navy);font:26px/1 var(--display)}
.card b{font:17px/1.1 var(--display);display:block}
.coins{display:flex;align-items:center;gap:5px;font:800 14px/1 var(--body);margin-top:3px;font-variant-numeric:tabular-nums}
.coin{width:14px;height:14px;border-radius:50%;background:var(--sun);box-shadow:inset -2px -2px 0 var(--sun-2);display:inline-block}
.chip{font:700 13px/1 var(--body);background:var(--chalk);border:2px solid var(--navy);border-radius:8px;padding:6px 9px}
.chip.speed{background:#d8f5c8}
.row{display:flex;gap:6px}
.iconbtn{font-size:15px;padding:8px 11px;position:relative}
.badge{position:absolute;top:-8px;right:-8px;background:var(--coral);color:#fff;font:800 11px/1 var(--body);border-radius:10px;padding:4px 6px;border:2px solid var(--navy)}
#mini{width:150px;height:98px;border:3px solid var(--navy);border-radius:10px;background:var(--grass);box-shadow:0 4px 0 rgba(13,21,40,.4)}

#prompt{position:fixed;z-index:6;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));font-size:18px;padding:12px 18px}
#emotes{position:fixed;z-index:5;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px))}
#emotes .btn{font-size:14px;padding:8px 10px;background:var(--chalk)}
#help{position:fixed;z-index:4;left:calc(12px + env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));font:700 12px/1.6 var(--body);color:var(--navy);background:rgba(255,250,240,.86);border-radius:8px;padding:6px 10px;max-width:250px}
#toasts{position:fixed;z-index:30;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{font:18px/1.2 var(--display);background:var(--navy);color:var(--chalk);border:3px solid var(--sun);border-radius:12px;padding:9px 16px;animation:pop .25s ease-out;white-space:nowrap}
.toast.big{font-size:34px;background:var(--sun);color:var(--navy);border-color:var(--navy)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}

/* touch */
#touch{display:none}
body.touch #touch{display:block}
body.touch #help{display:none}
#joy{position:fixed;z-index:6;left:calc(20px + env(safe-area-inset-left,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;background:rgba(255,250,240,.35);border:3px solid rgba(27,42,74,.5);touch-action:none}
#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:var(--sun);border:3px solid var(--navy)}
#btnJump{position:fixed;z-index:6;right:calc(22px + env(safe-area-inset-right,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));width:72px;height:72px;border-radius:50%;font-size:16px;padding:0}
body.touch #emotes{left:auto;transform:none;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(120px + env(safe-area-inset-bottom,0px));flex-direction:column}
body.touch #prompt{bottom:calc(160px + env(safe-area-inset-bottom,0px))}

/* modal */
#modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(13,21,40,.45);padding:16px}
.sheet{width:min(520px,100%);max-height:min(82vh,720px);display:flex;flex-direction:column;background:var(--paper);border:4px solid var(--navy);border-radius:16px;box-shadow:0 8px 0 rgba(13,21,40,.5);overflow:hidden;user-select:text;-webkit-user-select:text}
.sheet header{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--navy);color:var(--chalk);padding:12px 14px 12px 18px}
.sheet h2{margin:0;font:24px/1.1 var(--display);text-wrap:balance}
.sheet .x{background:var(--chalk);color:var(--navy);border:0;border-radius:8px;width:36px;height:36px;font-size:18px;cursor:pointer}
.mbody{overflow:auto;padding:16px 18px 20px;display:flex;flex-direction:column;gap:12px;font-size:14px;line-height:1.6}
.mbody h3{margin:4px 0 0;font:18px/1.2 var(--display)}
.note{color:var(--muted);font-size:12px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:12px;align-items:flex-start;background:#fff;border:2px solid var(--line);border-radius:10px;padding:10px 12px}
.item .grow{flex:1;min-width:0}
.item b{font:17px/1.25 var(--display);display:block}
.pill{display:inline-block;font:800 11px/1 var(--body);padding:4px 7px;border-radius:6px;background:var(--navy);color:var(--chalk);margin-right:6px;vertical-align:2px}
.pill.hot{background:var(--coral)}
.pill.ok{background:#3c9a4b}
.meta{color:var(--muted);font-size:12px}
.sws{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:34px;height:34px;border-radius:8px;border:3px solid var(--navy);cursor:pointer;padding:0}
.sw.on{box-shadow:0 0 0 3px var(--sun),0 0 0 6px var(--navy)}
.styles{display:flex;flex-wrap:wrap;gap:6px}
.stb{font:700 13px/1 var(--body);background:#fff;color:var(--navy);border:2px solid var(--navy);border-radius:8px;padding:8px 10px;cursor:pointer}
.stb.on{background:var(--navy);color:var(--chalk)}
.stb:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font:800 13px/1 var(--body)}
input[type=text],input[type=number]{font:700 16px var(--body);padding:10px 12px;border:3px solid var(--navy);border-radius:10px;background:#fff;color:var(--navy);width:100%;box-sizing:border-box;user-select:text;-webkit-user-select:text}
.drinks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.drink{background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;min-width:0}
.can{width:34px;height:56px;border-radius:7px;border:3px solid var(--navy)}
.drink b{font:15px/1.2 var(--display)}
.drink span{font-size:11px;color:var(--muted);line-height:1.4}
.coupon{border:3px dashed var(--navy);border-radius:12px;padding:12px;background:#fff;text-align:center}
.coupon code{font:26px/1.2 var(--display);letter-spacing:.08em}
.stamps{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.stamp{aspect-ratio:1;max-width:100%;border:3px solid var(--navy);border-radius:10px;display:grid;place-items:center;font:15px var(--display);background:#fff;color:var(--muted)}
.stamp.on{background:var(--sun);color:var(--navy)}
.rank{display:flex;flex-direction:column;gap:4px;font-variant-numeric:tabular-nums}
.rank div{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;background:#fff;border-radius:8px;padding:8px 12px;border:2px solid var(--line)}
.rank div.me{background:var(--sun);border-color:var(--navy)}
.rank i{font:18px var(--display);font-style:normal}
.check{width:26px;height:26px;border-radius:7px;border:3px solid var(--navy);display:grid;place-items:center;font:800 14px var(--body);flex:none;background:#fff}
.check.on{background:#3c9a4b;color:#fff}
.reward{font:800 13px var(--body);display:flex;align-items:center;gap:4px;white-space:nowrap}

/* start */
#start{position:fixed;z-index:15;left:calc(24px + env(safe-area-inset-left,0px));top:50%;transform:translateY(-50%);width:min(370px,calc(100% - 32px));background:var(--paper);border:4px solid var(--navy);border-radius:18px;box-shadow:0 8px 0 rgba(13,21,40,.45);padding:20px;display:flex;flex-direction:column;gap:14px;max-height:calc(100% - 32px);overflow:auto;box-sizing:border-box}
#start .eyebrow{font:800 12px/1 var(--body);letter-spacing:.12em;color:var(--coral)}
#start h1{margin:0;font:38px/1.05 var(--display);text-wrap:balance}
#start p{margin:0;font-size:14px;line-height:1.6;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 92px;gap:10px}
@media (max-width:640px){
  #start{left:50%;top:auto;bottom:calc(12px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-height:58%;padding:16px;gap:10px}
  #start h1{font-size:28px}
  #mini{width:118px;height:78px}
  .drinks{grid-template-columns:1fr}
  .drink{flex-direction:row;text-align:left}
}
#loading{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:var(--sky);font:24px var(--display);color:var(--navy)}

/* lifting */
#lift{position:fixed;inset:0;z-index:25;display:grid;place-items:center;background:rgba(13,21,40,.6);padding:12px}
.liftbox{position:relative;width:min(380px,100%);border:4px solid var(--navy);border-radius:18px;overflow:hidden;box-shadow:0 8px 0 rgba(13,21,40,.5);background:var(--paper)}
#lc{display:block;width:100%;aspect-ratio:360/540;max-width:100%;touch-action:none;cursor:pointer}
#liftClose{position:absolute;top:10px;right:10px;font-size:14px;padding:7px 10px}
#liftRes{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(255,246,224,.94);text-align:center;padding:20px}
#liftRes h2{margin:0;font:30px var(--display)}
#liftRes .big{font:76px/1 var(--display)}
#liftRes .row{flex-wrap:wrap;justify-content:center}
@media (max-width:1000px){ #toasts{top:calc(118px + env(safe-area-inset-top,0px))} .toast{white-space:normal;text-align:center;max-width:calc(100vw - 40px);box-sizing:border-box} }
#start button[type=submit]{position:sticky;bottom:0;flex:none}
@media (max-height:520px){
  #toasts{top:calc(64px + env(safe-area-inset-top,0px))}
  body.touch #emotes{flex-direction:row;bottom:calc(14px + env(safe-area-inset-bottom,0px));right:calc(110px + env(safe-area-inset-right,0px))}
  body.touch #prompt{bottom:calc(70px + env(safe-area-inset-bottom,0px))}
  #joy{width:100px;height:100px;bottom:calc(14px + env(safe-area-inset-bottom,0px))} #knob{left:25px;top:25px}
  #btnJump{width:62px;height:62px;bottom:calc(18px + env(safe-area-inset-bottom,0px))}
  #mini{width:118px;height:78px}
  #start{top:calc(12px + env(safe-area-inset-top,0px));transform:none;max-height:calc(100% - 24px);padding:14px;gap:8px}
  #start h1{font-size:24px} #start p{display:none}
  .sheet{max-height:calc(100vh - 24px)}
  .liftbox{width:min(250px,100%)}
}

#shot{position:fixed;inset:0;z-index:25;display:grid;place-items:center;background:rgba(13,21,40,.6);padding:12px}
#sc{display:block;width:100%;aspect-ratio:360/540;max-width:100%;touch-action:none;cursor:crosshair}
#shotClose{position:absolute;top:10px;right:10px;font-size:14px;padding:7px 10px}
#shotRes{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(255,246,224,.95);text-align:center;padding:20px}
#shotRes h2{margin:0;font:30px var(--display)} #shotRes .big{font:76px/1 var(--display)} #shotRes .row{flex-wrap:wrap;justify-content:center}
.gain{display:inline-block;font:800 13px/1 var(--body);background:#d8f5c8;color:#1d5a2a;border:2px solid #3c9a4b;border-radius:8px;padding:6px 9px}
.stam{width:92px;height:6px;background:rgba(255,255,255,.22);border-radius:3px;margin-top:6px;overflow:hidden}
.stam i{display:block;height:100%;width:100%;background:#7bd389}
.stam i.tired{background:var(--coral)}
#pcard{cursor:pointer;border:0;font:inherit;text-align:left}
#pcard:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.cardhint{font:700 10px/1 var(--body);opacity:.7;margin-top:5px}
#clubChip{background:var(--navy);color:var(--chalk);border-color:var(--navy)}
#drChip{display:flex;align-items:center;gap:8px;background:var(--sun);font:800 14px/1 var(--body);border:3px solid var(--navy);border-radius:10px;padding:6px 6px 6px 10px;font-variant-numeric:tabular-nums}
#drChip button{font-size:13px;padding:6px 8px;box-shadow:0 2px 0 var(--navy)}
#fade{position:fixed;inset:0;z-index:35;background:#0d1528;opacity:0;transition:opacity .4s;pointer-events:none;display:grid;place-items:center;color:var(--chalk);font:28px var(--display)}
#fade.on{opacity:1}
.pcard{--tc:#9a5b2e;--tl:#f0c49b;width:100%;max-width:300px;margin:0 auto;box-sizing:border-box;background:linear-gradient(160deg,var(--tl),var(--tc));border:4px solid var(--navy);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px;box-shadow:0 6px 0 rgba(13,21,40,.35)}
.pc-top{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:start}
.pc-ovr{display:flex;flex-direction:column;align-items:center;gap:2px}
.pc-ovr b{font:52px/1 var(--display)} .pc-ovr span{font:800 12px/1 var(--body);background:var(--navy);color:var(--chalk);border-radius:6px;padding:4px 6px}
.pc-ovr em{font:800 12px/1 var(--body);font-style:normal;margin-top:6px}
.pcard img,.pc-ph{width:100%;aspect-ratio:240/300;max-width:100%;border-radius:12px;border:3px solid var(--navy);object-fit:cover;background:#9fd8f5;display:block;box-sizing:border-box}
.pc-name{font:24px/1.1 var(--display);text-align:center} .pc-name span{font-size:18px;opacity:.75}
.pc-club{text-align:center;font:800 12px/1 var(--body);letter-spacing:.06em;opacity:.8}
.pc-stats{display:flex;flex-direction:column;gap:6px;background:rgba(255,250,240,.75);border-radius:12px;padding:10px 12px}
.pc-stats div{display:grid;grid-template-columns:84px 1fr 30px;gap:8px;align-items:center;font:800 12px/1 var(--body);font-variant-numeric:tabular-nums}
.pc-stats i{display:block;height:9px;border-radius:5px;background:rgba(27,42,74,.15);overflow:hidden} .pc-stats i u{display:block;height:100%;background:var(--navy)}
.pc-stats b{text-align:right;font:18px var(--display)}
.howto{display:grid;grid-template-columns:1fr 1fr;gap:8px} .howto div{background:#fff;border:2px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;line-height:1.45} .howto b{display:block;font:15px var(--display)}
.battle{display:flex;flex-direction:column;gap:6px;font-variant-numeric:tabular-nums}
.battle div{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:10px;padding:10px 12px}
.battle div.me{background:var(--sun);border-color:var(--navy)} .battle div.empty{background:transparent;border-style:dashed;color:var(--muted)}
.battle i{font:20px var(--display);font-style:normal} .battle b{font:18px var(--display)}
.vid{width:100%;max-width:100%;border-radius:12px;background:#000;display:block;aspect-ratio:16/9}
.vidph{aspect-ratio:16/9;max-width:100%;border-radius:12px;background:var(--navy);color:var(--chalk);display:grid;place-items:center;text-align:center;padding:16px;box-sizing:border-box;font:20px/1.4 var(--display)}
@media (max-width:640px){ .howto{grid-template-columns:1fr} }
@media (max-height:520px){ .shotbox{width:min(250px,100%)} }
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
</style>

<div id="stage"></div>
<div id="labels"></div>
<div id="loading">클럽하우스를 짓는 중…</div>

<div class="hud" id="hud-tl" hidden>
  <button class="card" id="pcard" aria-label="내 선수 카드 보기"><span class="num" id="hNum">7</span><div><b id="hName">새싹선수</b><div class="coins"><i class="coin"></i><span id="hCoins">0</span><span class="cardhint">· 선수 카드</span></div><div class="stam"><i id="stamFill"></i></div></div></button>
  <div class="chip" id="clubChip">하프타임 FC</div>
  <div class="row"><div class="chip" id="onChip" hidden></div><div class="chip" id="saveChip" hidden></div></div>
  <div class="chip speed" id="buff" hidden></div>
  <div id="drChip" hidden><span id="drText">드리블</span><button class="btn ghost" id="drStop">그만</button></div>
</div>
<div class="hud" id="hud-tr" hidden>
  <div class="row">
    <button class="btn iconbtn" id="bMission">미션<span class="badge" id="mBadge">0</span></button>
    <button class="btn ghost iconbtn" id="bRank">랭킹</button>
    <button class="btn ghost iconbtn" id="bSound" aria-label="소리 켜기/끄기">소리 켬</button>
    <button class="btn ghost iconbtn" id="bHelp" aria-label="도움말">?</button>
  </div>
  <canvas id="mini" width="300" height="196"></canvas>
</div>
<button class="btn" id="prompt" hidden></button>
<div class="hud row" id="emotes" hidden>
  <button class="btn" data-e="0">👋 안녕</button>
  <button class="btn" data-e="1">👍 최고</button>
  <button class="btn" data-e="2">⚽ 같이 해</button>

const labels=$('#labels');
class Avatar{
  constructor(look,name,kind){
    this.root=new THREE.Group(); this.model=new THREE.Group(); this.root.add(this.model); scene.add(this.root);
    this.phase=0; this.speed=0; this.vy=0; this.y=0; this.kickCool=0; this.bubbleT=0; this.kind=kind||'npc';
    this.tag=document.createElement('div'); this.tag.className='tag'+(kind==='me'?' me':kind==='coach'?' coach':kind==='friend'?' friend':''); labels.appendChild(this.tag);
    this.bub=document.createElement('div'); this.bub.className='bubble'; this.bub.hidden=true; labels.appendChild(this.bub);
    this.setName(name); this.setLook(look);
  }
  setName(n){ const changed=this.name!==n; this.name=n; this.tag.textContent=n; if(changed&&this.look) this.setLook(this.look); }
  setLook(L){
    this.look=Object.assign({},L); const M=this.model;
    while(M.children.length) M.remove(M.children[0]);
    const sk=L.skin, skD=shade(sk,-.12), trim=lum(L.jersey)>150?'#1b2a4a':'#ffc93c';
    const boot=L.boots==='gold'?'#f2c230':'#22262f', bootAcc=L.boots==='gold'?'#fffaf0':trim;
    // legs: shorts + stripe, knee, sock with club band, boot with sole and side stripe
    const leg=x=>{ const g=new THREE.Group(); g.position.set(x,.8,0); M.add(g); const out=Math.sign(x);
      part(.29,.32,.31,L.shorts,0,-.16,0,g); part(.02,.3,.1,trim,out*.146,-.17,0,g,1);
      part(.23,.1,.24,sk,0,-.37,0,g);
      part(.25,.27,.26,'#fffaf0',0,-.555,0,g); part(.255,.05,.265,L.jersey,0,-.45,0,g,1);
      part(.27,.12,.38,boot,0,-.74,.05,g); part(.28,.03,.4,'#e8e8e8',0,-.815,.05,g,1); part(.275,.035,.16,bootAcc,0,-.72,.08,g,1);
      return g; };
    this.legL=leg(-.15); this.legR=leg(.15);
    // torso with printed front/back
    const jm=lam(L.jersey);
    const fm=new THREE.MeshLambertMaterial({map:jerseyTex(L.jersey,L.number,true)});
    const bm=new THREE.MeshLambertMaterial({map:jerseyTex(L.jersey,L.number,false,this.name)});
    const body=new THREE.Mesh(geo(.62,.72,.34),[jm,jm,jm,jm,fm,bm]); body.position.y=1.16; body.castShadow=true; M.add(body);
    part(.64,.06,.36,L.shorts,0,.83,0,M,1);
    part(.3,.05,.355,trim,0,1.5,0,M,1); part(.1,.08,.02,trim,0,1.45,.172,M,1);
    part(.18,.08,.18,skD,0,1.56,0,M);
    // arms: sleeve + cuff, forearm, hand
    const arm=x=>{ const g=new THREE.Group(); g.position.set(x,1.47,0); M.add(g);
      part(.21,.28,.24,L.jersey,0,-.13,0,g); part(.215,.04,.245,trim,0,-.27,0,g,1);
      part(.17,.34,.19,sk,0,-.45,0,g); part(.19,.14,.21,skD,0,-.68,.01,g); return g; };
    this.armL=arm(-.42); this.armR=arm(.42);
    // head
    const h=new THREE.Group(); h.position.y=1.59; M.add(h); this.head=h;
    part(.5,.52,.48,sk,0,.26,0,h);
    [-1,1].forEach(s=>part(.05,.12,.1,skD,s*.265,.25,0,h,1));
    this.eyes=[];
    [-1,1].forEach(s=>{ const e=new THREE.Group(); e.position.set(s*.11,.28,.242); h.add(e);
      part(.11,.09,.01,'#ffffff',0,0,0,e,1); part(.055,.075,.012,'#2b1d14',s*-.012,-.004,.003,e,1); part(.02,.02,.014,'#ffffff',s*-.022,.02,.006,e,1);
      this.eyes.push(e);
      part(.13,.03,.02,shade(L.hair,-.1),s*.11,.365,.245,h,1);
      part(.07,.04,.01,'#f2a594',s*.17,.17,.242,h,1); });
    part(.06,.08,.05,skD,0,.21,.25,h,1);
    part(.13,.025,.01,'#9c4a3a',0,.115,.242,h,1); part(.08,.015,.012,'#ffffff',0,.12,.244,h,1);
    // hair styles
    const hc=L.hair, st=L.hairStyle||'short';
    if(st==='buzz'){ part(.52,.05,.5,hc,0,.535,0,h); part(.52,.22,.04,hc,0,.43,-.245,h); part(.52,.04,.04,hc,0,.5,.245,h,1); }
    else {
      part(.54,.1,.52,hc,0,.56,0,h);
      if(st==='curly'){ [[-.18,-.15],[0,-.18],[.18,-.15],[-.2,.08],[.2,.08],[0,.12],[-.08,-.02],[.1,-.02]].forEach(([x,z])=>part(.18,.12,.18,hc,x,.66,z,h)); part(.56,.34,.12,hc,0,.42,-.22,h); [-1,1].forEach(s=>part(.06,.24,.44,hc,s*.27,.45,-.02,h)); part(.54,.1,.08,hc,0,.5,.23,h); }
      else if(st==='spiky'){ [[-.16,.1],[0,.14],[.16,.1],[-.1,-.1],[.1,-.1],[0,-.2]].forEach(([x,z],i)=>{ const m=part(.12,.16,.12,hc,x,.67,z,h); m.rotation.x=z>0?.35:-.25; m.rotation.z=x*1.4; }); part(.54,.26,.08,hc,0,.42,-.24,h); [-1,1].forEach(s=>part(.04,.16,.38,hc,s*.27,.47,-.03,h)); part(.16,.1,.06,hc,-.15,.48,.245,h); part(.14,.08,.06,hc,.12,.5,.245,h); }
      else if(st==='long'){ part(.56,.58,.1,hc,0,.27,-.25,h); [-1,1].forEach(s=>part(.06,.44,.46,hc,s*.28,.34,-.02,h)); part(.54,.1,.07,hc,0,.48,.24,h); part(.16,.3,.14,hc,0,.24,-.34,h); part(.17,.06,.15,'#e8443a',0,.4,-.34,h,1); }

    }
    if(L.hat==='band'){ part(.53,.08,.51,'#e8443a',0,.44,0,h); }
    if(L.hat==='cap'){ part(.56,.17,.54,'#1b2a4a',0,.62,0,h); part(.46,.04,.28,'#ffc93c',0,.54,.36,h); part(.12,.09,.02,'#ffc93c',0,.64,.272,h,1); }
    if(L.hat==='crown'){ part(.44,.14,.44,'#f2c230',0,.7,0,h); [[-.17,-.17],[.17,-.17],[-.17,.17],[.17,.17],[0,.17]].forEach(([x,z])=>part(.09,.13,.09,'#f2c230',x,.83,z,h)); part(.07,.07,.02,'#e8443a',0,.7,.222,h,1); }
    this.blinkT=rnd(1,4);
  }
  anim(dt){
    const k=Math.min(1,this.speed/6);
    if(this.speed>.2) this.phase+=dt*(5+this.speed*1.2); else this.phase*=.85;
    const s=Math.sin(this.phase)*.8*k;
    this.legL.rotation.x=s; this.legR.rotation.x=-s; this.armL.rotation.x=-s*.8; this.armR.rotation.x=s*.8;
    const air=this.y>.05;
    this.armL.rotation.z=air?-.6:-.04; this.armR.rotation.z=air?.6:.04;
    this.model.position.y=Math.abs(Math.sin(this.phase))*.07*k;

    if(this.kickCool>0) this.kickCool-=dt;
    if(this.bubbleT>0){ this.bubbleT-=dt; if(this.bubbleT<=0) this.bub.hidden=true; }
  }
  say(t,dur){ this.bub.textContent=t; this.bub.hidden=false; this.bubbleT=dur||2.6; }
}

function resolve(p,r){
  for(const c of COL){ if(p.x>c.x0-r&&p.x<c.x1+r&&p.z>c.z0-r&&p.z<c.z1+r){ const l=p.x-(c.x0-r),R=(c.x1+r)-p.x,t=p.z-(c.z0-r),b=(c.z1+r)-p.z,m=Math.min(l,R,t,b);
    if(m===l)p.x=c.x0-r; else if(m===R)p.x=c.x1+r; else if(m===t)p.z=c.z0-r; else p.z=c.z1+r; } }
  p.x=clamp(p.x,-52,52); p.z=clamp(p.z,-40,28);
}
function lerpAngle(a,b,t){ let d=((b-a+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI; return a+d*t; }

addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='INPUT') return;
  if(!$('#shot').hidden){ e.preventDefault(); const st=SH.state;
    if(st==='aim'){ const d=8; if(e.code==='ArrowLeft') SH.aim.x=clamp(SH.aim.x-d,GL-30,GR+30); if(e.code==='ArrowRight') SH.aim.x=clamp(SH.aim.x+d,GL-30,GR+30); if(e.code==='ArrowUp') SH.aim.y=clamp(SH.aim.y-d,GT-50,GB-8); if(e.code==='ArrowDown') SH.aim.y=clamp(SH.aim.y+d,GT-50,GB-8); if(e.code==='Space'||e.code==='Enter') lockAim(); }
    else if(st==='power'&&(e.code==='Space'||e.code==='Enter')) fireShot();
    if(e.code==='Escape') closeShot(); return; }
  if(!$('#lift').hidden){ if(e.code==='Space'||e.code==='Enter'){ e.preventDefault(); liftTap(); } if(e.code==='Escape') closeLift(); return; }
  if(!$('#modal').hidden){ if(e.code==='Escape') closeModal(); return; }
  keys[e.code]=true;
  if(!started) return;
  if(e.code==='Space'){ e.preventDefault(); jump(); }
  if(e.code==='KeyE') act();
  if(e.code==='KeyF') shoot();
  if(/^Digit[1-4]$/.test(e.code)) emote(+e.code.slice(5)-1);
});
addEventListener('keyup',e=>{ keys[e.code]=false; });
addEventListener('blur',()=>{ for(const k in keys) keys[k]=false; });
const cv=renderer.domElement; let drag=null;

cv.addEventListener('pointermove',e=>{ if(!drag||drag.id!==e.pointerId) return; const dx=e.clientX-drag.x, dy=e.clientY-drag.y; drag.x=e.clientX; drag.y=e.clientY; yaw-=dx*.006; pitch=clamp(pitch+dy*.004,.08,1.25); });
const endDrag=e=>{ if(drag&&drag.id===e.pointerId) drag=null; };
cv.addEventListener('pointerup',endDrag); cv.addEventListener('pointercancel',endDrag);

const joy=$('#joy'), knob=$('#knob'); let joyId=null;
joy.addEventListener('pointerdown',e=>{ joyId=e.pointerId; try{joy.setPointerCapture(e.pointerId);}catch(_){} moveJoy(e); });

function updateDribble(dt){ if(!DR.on) return; const p=player.root.position;

function updatePlayer(dt,now){
  let ix=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+joyX;
  let iz=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0)-joyY;
  if(uiBlock){ ix=iz=0; }
  const len=Math.hypot(ix,iz); if(len>1){ ix/=len; iz/=len; }
  const fx=-Math.sin(yaw), fz=-Math.cos(yaw), rx=Math.cos(yaw), rz=-Math.sin(yaw);
  const dx=fx*iz+rx*ix, dz=fz*iz+rz*ix, mag=Math.min(1,Math.hypot(dx,dz));
  if(DR.on&&DR.count>0){ ix=iz=0; }
  const want=(keys.ShiftLeft||keys.ShiftRight||Math.hypot(joyX,joyY)>.92)&&Math.hypot(ix,iz)>.1;
  const maxE=3+S.stats.stamina*.07; let run=false;

  else { energy=Math.min(maxE,energy+dt*.75); if(tired&&energy>maxE*.35) tired=false; }
  const base=(run?7.9+S.stats.speed*.022:4.9+S.stats.speed*.012)*(buffUntil>now?1.3:1);
  const p=player.root.position; p.x+=dx*base*dt; p.z+=dz*base*dt; resolve(p,.42);
  if(mag>.05) player.model.rotation.y=lerpAngle(player.model.rotation.y,Math.atan2(dx,dz),1-Math.exp(-14*dt));
  player.speed=base*mag;
  player.vy-=24*dt; player.y+=player.vy*dt; if(player.y<0){ player.y=0; player.vy=0; } p.y=player.y;
}
function updateNPCs(dt){

        const gx=a.side*22.5-ball.p.x, gz=-ball.p.z, gl=Math.hypot(gx,gz)||1; const bx=ball.p.x-gx/gl*.95, bz=ball.p.z-gz/gl*.95;
        if(Math.hypot(bx-p.x,bz-p.z)<.7){ tx=ball.p.x; tz=ball.p.z; } else { tx=bx; tz=bz; } sp=4.3;

}

  const fr=b.y<=.37?1.5:.2; v.x*=Math.exp(-fr*dt); v.z*=Math.exp(-fr*dt);

function expandLook(c){ c=c&&typeof c==='object'?c:{}; return {jersey:HEX(c.j)?c.j:'#ffffff',shorts:HEX(c.sh)?c.sh:'#1b2a4a',skin:HEX(c.sk)?c.sk:'#f3c99a',hair:HEX(c.h)?c.h:'#2a1c14',hairStyle:['short','spiky','curly','long','buzz'].includes(c.hs)?c.hs:'short',number:clamp(parseInt(c.n)||1,1,99),hat:['band','cap','crown'].includes(c.ht)?c.ht:null,boots:c.b==='gold'?'gold':null}; }
const num=(v,d)=>{ v=+v; return isFinite(v)?v:d; };
function syncOther(p){ const pr=p.presence||{}; if(typeof pr.x!=='number'||typeof pr.z!=='number') return;
  const name=(typeof pr.n==='string'&&pr.n.trim()?pr.n.trim():'친구').slice(0,8);
  let o=others.get(p.peer); const lk=JSON.stringify(pr.L||{});
  if(!o){ const av=new Avatar(expandLook(pr.L),name,'friend'); av.root.position.set(clamp(pr.x,-52,52),0,clamp(pr.z,-40,28)); o={av,lk,tx:0,ty:0,tz:0,r:0,s:0,c:null,et:pr.et||0}; others.set(p.peer,o); setTimeout(updOnline,0); }
  else { if(lk!==o.lk){ o.lk=lk; o.av.setLook(expandLook(pr.L)); } if(o.av.name!==name) o.av.setName(name); }
  o.tx=clamp(num(pr.x,0),-52,52); o.tz=clamp(num(pr.z,0),-40,28); o.ty=clamp(num(pr.y,0),0,4); o.r=num(pr.r,0); o.s=clamp(num(pr.s,0),0,12); o.c=pr.c==='away'?'away':'home';
  if(pr.et&&pr.et!==o.et){ o.et=pr.et; if(EMOTE_OK.has(pr.e)) o.av.say(pr.e); }
  const pp=o.av.root.position; if(Math.hypot(pp.x-o.tx,pp.z-o.tz)>8) pp.set(o.tx,o.ty,o.tz); }
function dropOther(peer){ const o=others.get(peer); if(!o) return; scene.remove(o.av.root); o.av.tag.remove(); o.av.bub.remove(); others.delete(peer); updOnline(); }
function updOnline(){ const c=$('#onChip'); if(!c) return; if(!ROOM||!started){ c.hidden=true; return; } const n=[...others.values()].filter(o=>o.c===CLUB.id).length; c.hidden=false; c.textContent='접속 중 '+(n+1)+'명'; }
capP.room.then(r=>{ if(!r) return; ROOM=r;
  try{ r.onPeers(ch=>{ for(const p of ch.left) dropOther(p.peer); for(const p of ch.peers){ if(p.sameTab) continue; syncOther(p); } updOnline(); },()=>{ ROOM=null; for(const k of [...others.keys()]) dropOther(k); updOnline(); }); }catch(e){ ROOM=null; } });
let SBCH=null; const MYPEER='t'+Math.random().toString(36).slice(2,10); const lastSeen=new Map();
function startSBRoom(){ if(NETMODE!=='sb'||SBCH) return; const sb=sbClient(); if(!sb) return;
  try{ SBCH=sb.channel('htfc-club-v1',{config:{broadcast:{self:false},presence:{key:MYPEER}}});
    SBCH.on('broadcast',{event:'st'},msg=>{ const pl=msg&&msg.payload; if(!pl||typeof pl.id!=='string'||pl.id===MYPEER||pl.id.length>20) return; lastSeen.set(pl.id,Date.now()); syncOther({peer:pl.id,presence:pl.pr||{}}); });
    SBCH.on('presence',{event:'leave'},ev=>{ (ev&&ev.leftPresences||[]).forEach(x=>{ if(x&&typeof x.peer==='string'){ dropOther(x.peer); lastSeen.delete(x.peer); } }); updOnline(); });
    SBCH.on('presence',{event:'join'},()=>{ lastPresStr=''; lastPresT=0; });
    SBCH.subscribe(st=>{ if(st==='SUBSCRIBED'){ ROOM={kind:'sb'}; SBCH.track({peer:MYPEER}).catch(()=>{}); lastPresStr=''; lastPresT=0; updOnline(); } else if(st==='CLOSED'||st==='CHANNEL_ERROR'||st==='TIMED_OUT'){ if(ROOM&&ROOM.kind==='sb') ROOM=null; updOnline(); } });
  }catch(e){ SBCH=null; } }
function sweepOthers(){ if(!ROOM||ROOM.kind!=='sb') return; const now=Date.now(); for(const [k,t] of lastSeen){ if(now-t>9000){ dropOther(k); lastSeen.delete(k); } } }
function sendPresence(now){ if(!ROOM||!started) return;
  if(ROOM.kind==='sb'){ const p=player.root.position, moving=player.speed>.1||player.y>.01;
    const pr={n:S.name,c:CLUB.id,x:+p.x.toFixed(2),y:+p.y.toFixed(2),z:+p.z.toFixed(2),r:+player.model.rotation.y.toFixed(2),s:+player.speed.toFixed(1),L:compactLook(S.look),e:myEmote.e,et:myEmote.et};
    const str=JSON.stringify(pr), gap=now-lastPresT;
    if((str!==lastPresStr&&gap>=(moving?250:400))||gap>=3000){ lastPresStr=str; lastPresT=now; try{ SBCH.send({type:'broadcast',event:'st',payload:{id:MYPEER,pr}}); }catch(e){} }
    return; }
  if(now-lastPresT<100) return; const p=player.root.position;
  const pr={n:S.name,c:CLUB.id,x:+p.x.toFixed(2),y:+p.y.toFixed(2),z:+p.z.toFixed(2),r:+player.model.rotation.y.toFixed(2),s:+player.speed.toFixed(1),L:compactLook(S.look),e:myEmote.e,et:myEmote.et};
  const str=JSON.stringify(pr); if(str===lastPresStr) return; lastPresStr=str; lastPresT=now; ROOM.presence(pr).catch(()=>{}); }
function updateOthers(dt){ const k=1-Math.exp(-10*dt);
  for(const o of others.values()){ const vis=started&&o.c===CLUB.id; o.av.root.visible=vis; if(!vis) continue; const p=o.av.root.position;
    p.x+=(o.tx-p.x)*k; p.z+=(o.tz-p.z)*k; p.y+=(o.ty-p.y)*k; o.av.y=p.y; o.av.model.rotation.y=lerpAngle(o.av.model.rotation.y,o.r,k); o.av.speed=o.s; o.av.anim(dt); } }

/* ---------------- start screen ---------------- */
function startScreen(){
  const f=$('#start'); f.hidden=false;
  let lastName=''; try{ lastName=localStorage.getItem(LASTKEY)||''; }catch(e){}
  if(lastName){ $('#sTitle').textContent='다시 왔구나, '+lastName+'!'; $('#sDesc').textContent='비밀번호를 넣으면 지난번 기록에 이어서 할 수 있어요.'; $('#sNote').textContent='다른 선수라면 이름을 바꾸고, 처음이면 비밀번호를 새로 정하세요.'; }
  $('#iName').value=lastName; $('#iNum').value=S.look.number; if(lastName) player.setName(lastName);
  const paint=()=>{
    $('#sJersey').innerHTML=JERSEYS.map(c=>`<button type="button" class="sw ${S.look.jersey===c?'on':''}" data-c="${c}" style="background:${c}" aria-label="유니폼 ${c}"></button>`).join('');
    $('#sHair').innerHTML=HAIRS.map(c=>`<button type="button" class="sw ${S.look.hair===c?'on':''}" data-c="${c}" style="background:${c}" aria-label="머리 ${c}"></button>`).join('');
    $('#sStyle').innerHTML=HAIRSTYLES.map(([k,n])=>`<button type="button" class="stb ${(S.look.hairStyle||'short')===k?'on':''}" data-s="${k}">${n}</button>`).join('');
    $('#sStyle').querySelectorAll('.stb').forEach(b=>b.addEventListener('click',()=>{ S.look.hairStyle=b.dataset.s; player.setLook(S.look); paint(); }));
    $('#sJersey').querySelectorAll('.sw').forEach(b=>b.addEventListener('click',()=>{ S.look.jersey=b.dataset.c; player.setLook(S.look); paint(); }));
    $('#sHair').querySelectorAll('.sw').forEach(b=>b.addEventListener('click',()=>{ S.look.hair=b.dataset.c; player.setLook(S.look); paint(); }));
  };
  paint();
  $('#iNum').addEventListener('input',e=>{ const n=parseInt(e.target.value); if(n>=1&&n<=99){ S.look.number=n; player.setLook(S.look); } });
  $('#iName').addEventListener('input',e=>player.setName(e.target.value.trim()||'새싹선수'));
  let busy=false;
  f.addEventListener('submit',async e=>{ e.preventDefault(); if(busy) return; const err=$('#sErr'); err.hidden=true;
    const nm=$('#iName').value.trim().slice(0,8), pin=$('#sPin').value.trim();
    if(!nm){ err.textContent='선수 이름을 적어 주세요.'; err.hidden=false; return; }
    if(!/^[0-9]{4}$/.test(pin)){ err.textContent='비밀번호는 숫자 4자리로 적어 주세요.'; err.hidden=false; return; }
    busy=true; const btn=f.querySelector('button[type=submit]'); const bt=btn.textContent; btn.textContent='기록 확인 중…'; btn.disabled=true;
    let res; try{ res=await login(nm,pin); }catch(x){ res={ok:false,msg:'잠깐 문제가 생겼어요. 다시 눌러 주세요.'}; }
    btn.textContent=bt; btn.disabled=false; busy=false;
    if(!res.ok){ err.textContent=res.msg; err.hidden=false; return; }
    player.setName(S.name); player.setLook(S.look);
    f.hidden=true; started=true; uiBlock=false; ['#hud-tl','#hud-tr','#emotes','#help','#touch'].forEach(s=>$(s).hidden=false);
    yaw=Math.PI; resize(); hud(); refreshRank(); sfx(523,.1,'square',.04); setTimeout(()=>sfx(784,.15,'square',.04),100);
    setSaveMode(saveMode); startSBRoom(); toast(res.returning?S.name+' 선수, 기록을 불러왔어요! 코인 '+S.coins+' · 종합 '+overall():'하프타임 FC에 입장했어요!'); if(vidEl) vidEl.play().catch(()=>{}); energy=3+S.stats.stamina*.07; if(S.lastAttend!==today()) setTimeout(()=>toast('클럽하우스 앞 빨간 키오스크에서 출석 도장을 찍어 보세요'),1500);
    renderer.domElement.focus&&renderer.domElement.focus(); });
}

/* ---------------- boot ---------------- */
function boot(){ buildWorld(); buildActors(); soundLabel(); resize(); $('#loading').hidden=true; startScreen(); requestAnimationFrame(t=>{ last=t; loop(t); }); }
const fontsReady=(document.fonts&&document.fonts.load)?Promise.all([document.fonts.load('40px Jua'),document.fonts.load('800 20px "Gothic A1"')]):Promise.resolve();
Promise.race([fontsReady,new Promise(r=>setTimeout(r,2500))]).catch(()=>{}).then(boot);
})();
</script>
